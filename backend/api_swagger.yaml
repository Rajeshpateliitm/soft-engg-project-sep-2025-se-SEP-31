openapi: 3.0.3
info:
  title: WasteWise API
  description: |
    REST API for WasteWise - A comprehensive waste management application.
    
    This API provides endpoints for:
    - User authentication and registration
    - Primary users (residents): Quiz system, waste logging, leaderboards, campaigns
    - Secondary users (RWA/Collectors): Pickup management, campaign creation, waste summaries
    - Tertiary users (Government/NGO): Ward performance monitoring, summaries
    - Common features: Recycler lookup, pickup requests, ward information
    
    **Authentication**: Most endpoints require a Bearer token obtained from login/register endpoints.
    
    **Base URL**: http://localhost:8000 (development)
    
    **API Version**: v1
    
    ## User Stories Mapping
    
    ### Primary User Stories
    - US-1: User Registration and Authentication
    - US-2: Daily Quiz System
    - US-3: Waste Logging
    - US-4: Leaderboard and Gamification
    - US-5: Monthly Engagement Tracking
    - US-6: Campaign Participation
    - US-7: Local Recycler Information
    
    ### Secondary User Stories
    - US-8: RWA Dashboard
    - US-9: Collector Dashboard
    - US-10: Pickup Request Management
    - US-11: RWA Leaderboard
    - US-12: Campaign Management
    - US-13: Waste Summary for Area
    
    ### Tertiary User Stories
    - US-14: Ward Performance Overview
    - US-15: Ward Summary Management
    
    ### Common User Stories
    - US-16: Pickup Request Creation
    - US-17: Ward Information
  version: 1.0.0
  contact:
    name: WasteWise API Support
    email: support@wastewise.com
  license:
    name: MIT

servers:
  - url: http://localhost:8000/api
    description: Development server
  - url: https://api.wastewise.com/api
    description: Production server

tags:
  - name: Authentication
    description: User authentication and registration endpoints
  - name: Primary User
    description: Endpoints for primary users (residents)
  - name: Secondary User
    description: Endpoints for secondary users (RWA managers and collectors)
  - name: Tertiary User
    description: Endpoints for tertiary users (Government/NGO)
  - name: Common
    description: Common endpoints available to all users

paths:
  # ========================================================================
  # Authentication Endpoints
  # ========================================================================
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: |
        Register a new primary user account. Only PRIMARY users can register through this endpoint.
        Secondary and Tertiary users are provisioned by administrators.
        
        **User Story**: US-1 (User Registration and Authentication)
        
        **Error Handling**:
        - 400: Missing required fields, email already exists
        - 403: Attempting to register as non-primary user
        - 500: Server error
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - house_number
                - ward_number
                - family_members
                - pincode
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 6
                  example: password123
                username:
                  type: string
                  example: john_doe
                house_number:
                  type: string
                  example: "123"
                ward_number:
                  type: string
                  example: "1"
                family_members:
                  type: integer
                  minimum: 1
                  example: 4
                pincode:
                  type: string
                  example: "560001"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
                  user:
                    $ref: '#/components/schemas/UserInfo'
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type:
                    type: string
                    example: bearer
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: |
        Authenticate user with email and password. Returns access token for API requests.
        
        **User Story**: US-1 (User Registration and Authentication)
        
        **Error Handling**:
        - 400: Missing email or password
        - 401: Invalid credentials
        - 403: Account inactive
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type:
                    type: string
                    example: bearer
                  user:
                    $ref: '#/components/schemas/UserInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user information
      description: |
        Get information about the currently authenticated user.
        
        **User Story**: US-1 (User Registration and Authentication)
        
        **Error Handling**:
        - 401: Authentication required
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ========================================================================
  # Primary User Endpoints
  # ========================================================================
  /primary/dashboard:
    get:
      tags:
        - Primary User
      summary: Get primary user dashboard
      description: |
        Get dashboard data including quiz performance, leaderboard rank, monthly engagement, and waste summary.
        
        **User Story**: US-4 (Leaderboard and Gamification), US-5 (Monthly Engagement Tracking)
        
        **Error Handling**:
        - 401: Authentication required
      operationId: getPrimaryDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimaryDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /primary/quiz/questions:
    get:
      tags:
        - Primary User
      summary: Get quiz questions
      description: |
        Get quiz questions for the daily quiz. Returns questions with options (without correct answers marked).
        
        **User Story**: US-2 (Daily Quiz System)
        
        **Error Handling**:
        - 401: Authentication required
      operationId: getQuizQuestions
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Number of questions to return
          schema:
            type: integer
            default: 10
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
      responses:
        '200':
          description: Quiz questions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuizQuestion'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /primary/quiz/submit:
    post:
      tags:
        - Primary User
      summary: Submit quiz answers
      description: |
        Submit quiz answers and get results. Awards points based on correct answers (10 points per correct answer).
        
        **User Story**: US-2 (Daily Quiz System)
        
        **Error Handling**:
        - 400: Missing answers
        - 401: Authentication required
      operationId: submitQuiz
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - answers
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    required:
                      - question_id
                      - selected_option_id
                    properties:
                      question_id:
                        type: integer
                      selected_option_id:
                        type: integer
      responses:
        '200':
          description: Quiz submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempt_id:
                    type: integer
                  score:
                    type: integer
                  total_questions:
                    type: integer
                  percentage:
                    type: number
                  points_earned:
                    type: integer
                  total_points:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /primary/quiz/performance:
    get:
      tags:
        - Primary User
      summary: Get quiz performance history
      description: |
        Get detailed quiz performance including accuracy, category breakdown, and past quiz attempts.
        
        **User Story**: US-2 (Daily Quiz System)
        
        **Error Handling**:
        - 401: Authentication required
      operationId: getQuizPerformance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Quiz performance retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizPerformance'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /primary/waste-log:
    post:
      tags:
        - Primary User
      summary: Log waste entry
      description: |
        Log a waste entry. Creates a pickup request with status "pending". Points are awarded when collector accepts the request.
        
        **User Story**: US-3 (Waste Logging), US-16 (Pickup Request Creation)
        
        **Error Handling**:
        - 400: Missing required fields
        - 401: Authentication required
        - 500: Server error
      operationId: logWaste
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
                - quantity_kg
                - log_date
              properties:
                category:
                  type: string
                  enum: [wet, dry, hazardous]
                quantity_kg:
                  type: number
                  minimum: 0
                log_date:
                  type: string
                  format: date
                separated:
                  type: boolean
                  default: false
                recycled:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Waste logged successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  log_id:
                    type: integer
                  pickup_request_id:
                    type: integer
                  status:
                    type: string
                    example: pending
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /primary/waste-logs:
    get:
      tags:
        - Primary User
      summary: Get waste log history
      description: |
        Get waste log history for the current user.
        
        **User Story**: US-3 (Waste Logging)
        
        **Error Handling**:
        - 401: Authentication required
      operationId: getWasteLogs
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Waste logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/WasteLog'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /primary/waste-summary:
    get:
      tags:
        - Primary User
      summary: Get waste summary
      description: |
        Get waste summary statistics for the current user.
        
        **User Story**: US-3 (Waste Logging)
        
        **Error Handling**:
        - 401: Authentication required
      operationId: getWasteSummary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Waste summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WasteSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /primary/leaderboard:
    get:
      tags:
        - Primary User
      summary: Get ward-specific leaderboard
      description: |
        Get community leaderboard showing rankings within the user's ward.
        
        **User Story**: US-4 (Leaderboard and Gamification)
        
        **Error Handling**:
        - 401: Authentication required
        - 404: User not assigned to a ward
      operationId: getLeaderboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Leaderboard retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  leaderboard:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeaderboardEntry'
                  user_rank:
                    type: integer
                  total_users:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /primary/monthly-engagement:
    get:
      tags:
        - Primary User
      summary: Get monthly engagement analytics
      description: |
        Get monthly engagement data including quizzes, waste logs, campaigns, points, and recent activities.
        
        **User Story**: US-5 (Monthly Engagement Tracking)
        
        **Error Handling**:
        - 401: Authentication required
      operationId: getMonthlyEngagement
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Monthly engagement data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyEngagement'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /primary/campaigns:
    get:
      tags:
        - Primary User
      summary: Get available campaigns
      description: |
        Get list of available campaigns for the user to join.
        
        **User Story**: US-6 (Campaign Participation)
        
        **Error Handling**:
        - 401: Authentication required
      operationId: getCampaigns
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Campaigns retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      $ref: '#/components/schemas/Campaign'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /primary/campaigns/{campaign_id}/register:
    post:
      tags:
        - Primary User
      summary: Register for a campaign
      description: |
        Register the current user for a campaign. Awards +5 points upon successful registration.
        
        **User Story**: US-6 (Campaign Participation)
        
        **Error Handling**:
        - 400: Already registered, campaign not available
        - 401: Authentication required
        - 404: Campaign not found
      operationId: registerForCampaign
      security:
        - bearerAuth: []
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Successfully registered for campaign
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  points_awarded:
                    type: integer
                    example: 5
                  total_points:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ========================================================================
  # Secondary User Endpoints
  # ========================================================================
  /secondary/dashboard:
    get:
      tags:
        - Secondary User
      summary: Get RWA manager dashboard
      description: |
        Get RWA manager dashboard with statistics for their area. Only accessible to users with admin role in RWA.
        
        **User Story**: US-8 (RWA Dashboard)
        
        **Error Handling**:
        - 401: Authentication required
        - 403: Not an RWA admin
      operationId: getSecondaryDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecondaryDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /secondary/collector/dashboard:
    get:
      tags:
        - Secondary User
      summary: Get collector dashboard
      description: |
        Get collector dashboard with pickup requests and daily pickup details.
        
        **User Story**: US-9 (Collector Dashboard)
        
        **Error Handling**:
        - 401: Authentication required
      operationId: getCollectorDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Collector dashboard retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /secondary/pickup-details:
    get:
      tags:
        - Secondary User
      summary: Get daily pickup details
      description: |
        Get pickup details for a specific date. Defaults to today if date not provided.
        
        **User Story**: US-10 (Pickup Request Management)
        
        **Error Handling**:
        - 401: Authentication required
      operationId: getPickupDetails
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Pickup details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  pickups:
                    type: array
                    items:
                      $ref: '#/components/schemas/PickupRequest'
                  accepted_count:
                    type: integer
                  rejected_count:
                    type: integer
                  pending_count:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /secondary/pickup/{pickup_id}/accept:
    post:
      tags:
        - Secondary User
      summary: Accept pickup request
      description: |
        Accept a pickup request. Awards points to the primary user (+5 for separated, +10 for recycled).
        
        **User Story**: US-10 (Pickup Request Management)
        
        **Error Handling**:
        - 400: Invalid request, pickup already processed
        - 401: Authentication required
        - 404: Pickup request not found
      operationId: acceptPickup
      security:
        - bearerAuth: []
      parameters:
        - name: pickup_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduled_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Pickup request accepted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  pickup:
                    $ref: '#/components/schemas/PickupRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /secondary/pickup/{pickup_id}/reject:
    post:
      tags:
        - Secondary User
      summary: Reject pickup request
      description: |
        Reject a pickup request. Deducts -5 points from the primary user.
        
        **User Story**: US-10 (Pickup Request Management)
        
        **Error Handling**:
        - 400: Invalid request, pickup already processed
        - 401: Authentication required
        - 404: Pickup request not found
      operationId: rejectPickup
      security:
        - bearerAuth: []
      parameters:
        - name: pickup_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Pickup request rejected successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  pickup:
                    $ref: '#/components/schemas/PickupRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /secondary/rwa-leaderboard:
    get:
      tags:
        - Secondary User
      summary: Get RWA leaderboard
      description: |
        Get leaderboard comparing different RWAs based on total points.
        
        **User Story**: US-11 (RWA Leaderboard)
        
        **Error Handling**:
        - 401: Authentication required
      operationId: getRWALeaderboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: RWA leaderboard retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  leaderboard:
                    type: array
                    items:
                      type: object
                      properties:
                        rwa_id:
                          type: integer
                        rwa_name:
                          type: string
                        ward_number:
                          type: string
                        points:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /secondary/campaigns:
    get:
      tags:
        - Secondary User
      summary: Get campaigns managed by user
      description: |
        Get campaigns created/managed by the current user.
        
        **User Story**: US-12 (Campaign Management)
        
        **Error Handling**:
        - 401: Authentication required
      operationId: getSecondaryCampaigns
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Campaigns retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      $ref: '#/components/schemas/Campaign'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /secondary/campaigns/create:
    post:
      tags:
        - Secondary User
      summary: Create new campaign
      description: |
        Create a new campaign. Only RWA admins can create campaigns.
        
        **User Story**: US-12 (Campaign Management)
        
        **Error Handling**:
        - 400: Missing required fields
        - 401: Authentication required
        - 403: Not an RWA admin
      operationId: createCampaign
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - start_date
                - end_date
              properties:
                title:
                  type: string
                description:
                  type: string
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                ward_id:
                  type: integer
      responses:
        '201':
          description: Campaign created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  campaign:
                    $ref: '#/components/schemas/Campaign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /secondary/campaigns/{campaign_id}:
    put:
      tags:
        - Secondary User
      summary: Update campaign
      description: |
        Update an existing campaign. Only RWA admins can update campaigns.
        
        **User Story**: US-12 (Campaign Management)
        
        **Error Handling**:
        - 401: Authentication required
        - 403: Not an RWA admin or not the creator
        - 404: Campaign not found
      operationId: updateCampaign
      security:
        - bearerAuth: []
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
      responses:
        '200':
          description: Campaign updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  campaign:
                    $ref: '#/components/schemas/Campaign'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Secondary User
      summary: Delete campaign
      description: |
        Delete a campaign. Only RWA admins can delete campaigns.
        
        **User Story**: US-12 (Campaign Management)
        
        **Error Handling**:
        - 401: Authentication required
        - 403: Not an RWA admin or not the creator
        - 404: Campaign not found
      operationId: deleteCampaign
      security:
        - bearerAuth: []
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Campaign deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /secondary/waste-summary:
    get:
      tags:
        - Secondary User
      summary: Get waste summary for area
      description: |
        Get waste summary statistics for the secondary user's area.
        
        **User Story**: US-13 (Waste Summary for Area)
        
        **Error Handling**:
        - 401: Authentication required
      operationId: getSecondaryWasteSummary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Waste summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WasteSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ========================================================================
  # Tertiary User Endpoints
  # ========================================================================
  /tertiary/dashboard:
    get:
      tags:
        - Tertiary User
      summary: Get government/NGO dashboard
      description: |
        Get dashboard with all ward performance data and statistics.
        
        **User Story**: US-14 (Ward Performance Overview)
        
        **Error Handling**:
        - 401: Authentication required
        - 403: Not a tertiary user
      operationId: getTertiaryDashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TertiaryDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tertiary/ward-performance:
    get:
      tags:
        - Tertiary User
      summary: Get ward performance overview
      description: |
        Get performance summary for all wards.
        
        **User Story**: US-14 (Ward Performance Overview)
        
        **Error Handling**:
        - 401: Authentication required
        - 403: Not a tertiary user
      operationId: getWardPerformance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ward performance retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ward_performance:
                    type: array
                    items:
                      $ref: '#/components/schemas/WardPerformance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tertiary/ward/{ward_id}/summary:
    get:
      tags:
        - Tertiary User
      summary: Get detailed ward summary
      description: |
        Get detailed monthly summary for a specific ward.
        
        **User Story**: US-15 (Ward Summary Management)
        
        **Error Handling**:
        - 401: Authentication required
        - 404: Ward not found
      operationId: getWardSummary
      security:
        - bearerAuth: []
      parameters:
        - name: ward_id
          in: path
          required: true
          schema:
            type: integer
        - name: months
          in: query
          schema:
            type: integer
            default: 12
      responses:
        '200':
          description: Ward summary retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ward:
                    type: object
                    properties:
                      id:
                        type: integer
                      ward_number:
                        type: string
                      name:
                        type: string
                  summaries:
                    type: array
                    items:
                      $ref: '#/components/schemas/WardMonthlySummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tertiary/ward/{ward_id}/update-summary:
    post:
      tags:
        - Tertiary User
      summary: Update ward monthly summary
      description: |
        Create or update monthly summary for a specific ward.
        
        **User Story**: US-15 (Ward Summary Management)
        
        **Error Handling**:
        - 400: Missing required fields
        - 401: Authentication required
        - 404: Ward not found
      operationId: updateWardSummary
      security:
        - bearerAuth: []
      parameters:
        - name: ward_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - year
                - month
              properties:
                year:
                  type: integer
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                total_households:
                  type: integer
                avg_wet_kg_per_day:
                  type: number
                avg_dry_kg_per_day:
                  type: number
                avg_hazardous_kg_per_day:
                  type: number
                segregation_compliance_pct:
                  type: number
                remarks:
                  type: string
      responses:
        '200':
          description: Ward summary updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  summary:
                    type: object
                    properties:
                      id:
                        type: integer
                      ward_id:
                        type: integer
                      year:
                        type: integer
                      month:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ========================================================================
  # Common Endpoints
  # ========================================================================
  /common/recyclers:
    get:
      tags:
        - Common
      summary: Get recycler locations by pincode
      description: |
        Get list of recyclers available in a specific pincode area.
        
        **User Story**: US-7 (Local Recycler Information)
        
        **Error Handling**:
        - 400: Pincode required
      operationId: getRecyclers
      parameters:
        - name: pincode
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recyclers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  recyclers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recycler'
        '400':
          $ref: '#/components/responses/BadRequest'

  /common/pickup-request:
    post:
      tags:
        - Common
      summary: Create pickup request
      description: |
        Create a pickup request for waste collection.
        
        **User Story**: US-16 (Pickup Request Creation)
        
        **Error Handling**:
        - 400: Missing required fields, invalid date format
        - 401: Authentication required
      operationId: createPickupRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - scheduled_at
                - pickup_location
              properties:
                scheduled_at:
                  type: string
                  format: date-time
                pickup_location:
                  type: string
                pincode:
                  type: string
                quantity:
                  type: number
                notes:
                  type: string
      responses:
        '201':
          description: Pickup request created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  request:
                    type: object
                    properties:
                      id:
                        type: integer
                      request_code:
                        type: string
                      scheduled_at:
                        type: string
                        format: date-time
                      status:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /common/wards:
    get:
      tags:
        - Common
      summary: Get all wards
      description: |
        Get list of all available wards.
        
        **User Story**: US-17 (Ward Information)
        
        **Error Handling**:
        - None (always returns list, even if empty)
      operationId: getWards
      responses:
        '200':
          description: Wards retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  wards:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ward'

# ========================================================================
# Components (Schemas and Responses)
# ========================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from /auth/login or /auth/register.
        Token is valid for 7 days.

  schemas:
    UserInfo:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        username:
          type: string
        user_category:
          type: string
          enum: [PRIMARY, SECONDARY, TERTIARY]
        points:
          type: integer
        rwa_role:
          type: string
          enum: [admin, collector, null]
          nullable: true

    UserDetail:
      allOf:
        - $ref: '#/components/schemas/UserInfo'
        - type: object
          properties:
            house_number:
              type: string
            ward_number:
              type: string
            family_members_count:
              type: integer
            pincode:
              type: string

    PrimaryDashboard:
      type: object
      properties:
        quiz_performance:
          type: object
          properties:
            average_score:
              type: number
            message:
              type: string
        leaderboard:
          type: object
          properties:
            rank:
              type: integer
            points:
              type: integer
            message:
              type: string
        monthly_engagement:
          type: object
          properties:
            quizzes:
              type: integer
            waste_logs:
              type: integer
            campaigns:
              type: integer
            message:
              type: string
        waste_summary:
          type: object
          properties:
            wet_kg:
              type: number
            dry_kg:
              type: number
            hazardous_kg:
              type: number

    QuizQuestion:
      type: object
      properties:
        id:
          type: integer
        question_text:
          type: string
        category:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              option_text:
                type: string
              is_correct:
                type: boolean
                description: Should be false in questions endpoint (answers hidden)

    QuizPerformance:
      type: object
      properties:
        quiz_score:
          type: number
        average_quiz_score:
          type: number
        overall_accuracy:
          type: number
        category_breakdown:
          type: object
        past_quizzes:
          type: array
          items:
            type: object

    WasteLog:
      type: object
      properties:
        id:
          type: integer
        category:
          type: string
          enum: [wet, dry, hazardous]
        quantity_kg:
          type: number
        log_date:
          type: string
          format: date
        separated:
          type: boolean
        recycled:
          type: boolean
        status:
          type: string
          enum: [pending, accepted, rejected, completed]
        points:
          type: integer

    WasteSummary:
      type: object
      properties:
        wet_kg:
          type: number
        dry_kg:
          type: number
        hazardous_kg:
          type: number
        total_kg:
          type: number

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        user_id:
          type: integer
        username:
          type: string
        points:
          type: integer

    MonthlyEngagement:
      type: object
      properties:
        quizzes:
          type: integer
        waste_logs:
          type: integer
        campaigns:
          type: integer
        points_this_month:
          type: integer
        recent_activities:
          type: array
          items:
            type: object

    Campaign:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        ward_id:
          type: integer
        created_by:
          type: integer
        is_registered:
          type: boolean

    PickupRequest:
      type: object
      properties:
        id:
          type: integer
        request_code:
          type: string
        requester_id:
          type: integer
        scheduled_at:
          type: string
          format: date-time
        pickup_location:
          type: string
        status:
          type: string
          enum: [pending, accepted, rejected, completed]
        quantity:
          type: number

    Recycler:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        pincode:
          type: string
        phone:
          type: string
        website:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        materials:
          type: array
          items:
            type: string

    Ward:
      type: object
      properties:
        id:
          type: integer
        ward_number:
          type: string
        name:
          type: string
        pincode:
          type: string

    WardPerformance:
      type: object
      properties:
        ward:
          type: string
        total_households:
          type: integer
        avg_wet_waste_kg_per_day:
          type: number
        avg_dry_waste_kg_per_day:
          type: number
        avg_hazardous_waste_kg_per_day:
          type: number
        segregation_compliance_pct:
          type: number
        remarks:
          type: string

    WardMonthlySummary:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        total_households:
          type: integer
        avg_wet_kg_per_day:
          type: number
        avg_dry_kg_per_day:
          type: number
        avg_hazardous_kg_per_day:
          type: number
        segregation_compliance_pct:
          type: number
        remarks:
          type: string

    SecondaryDashboard:
      type: object
      properties:
        total_users:
          type: integer
        total_points:
          type: integer
        monthly_pickups:
          type: integer
        active_campaigns:
          type: integer

    CollectorDashboard:
      type: object
      properties:
        pending_pickups:
          type: integer
        accepted_pickups:
          type: integer
        rejected_pickups:
          type: integer
        today_pickups:
          type: array
          items:
            $ref: '#/components/schemas/PickupRequest'

    TertiaryDashboard:
      type: object
      properties:
        wardData:
          type: array
          items:
            type: object
        totalWards:
          type: integer
        totalHouseholds:
          type: integer
        averageCompliance:
          type: number
        totalWetWaste:
          type: number
        totalDryWaste:
          type: number
        totalHazardousWaste:
          type: number
        excellentCount:
          type: integer
        goodCount:
          type: integer
        needsImprovementCount:
          type: integer
        priorityActions:
          type: array
          items:
            type: object

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
        details:
          type: string
          description: Additional error details (only in development mode)

  responses:
    BadRequest:
      description: Bad request - invalid input or missing required fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Missing required field: email"

    Unauthorized:
      description: Unauthorized - authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Authentication required"

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Only RWA admins can create campaigns"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Campaign not found"

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "An error occurred processing your request"

