<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <rect width="800" height="600" fill="#e8f4f8"/>
  
  <!-- Map grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d0e8f2" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)" />
  
  <!-- Streets -->
  <line x1="100" y1="0" x2="100" y2="600" stroke="#cccccc" stroke-width="3"/>
  <line x1="300" y1="0" x2="300" y2="600" stroke="#cccccc" stroke-width="3"/>
  <line x1="500" y1="0" x2="500" y2="600" stroke="#cccccc" stroke-width="3"/>
  <line x1="700" y1="0" x2="700" y2="600" stroke="#cccccc" stroke-width="3"/>
  
  <line x1="0" y1="150" x2="800" y2="150" stroke="#cccccc" stroke-width="3"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#cccccc" stroke-width="3"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#cccccc" stroke-width="3"/>
  
  <!-- Parks/Green areas -->
  <circle cx="150" cy="100" r="40" fill="#90EE90" opacity="0.6"/>
  <circle cx="650" cy="150" r="50" fill="#90EE90" opacity="0.6"/>
  <circle cx="200" cy="500" r="45" fill="#90EE90" opacity="0.6"/>
  
  <!-- Recycler Markers -->
  <!-- Marker 1 -->
  <circle cx="200" cy="200" r="20" fill="#FF6B6B" stroke="white" stroke-width="3"/>
  <text x="200" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="white">1</text>
  
  <!-- Marker 2 -->
  <circle cx="400" cy="350" r="20" fill="#FF6B6B" stroke="white" stroke-width="3"/>
  <text x="400" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="white">2</text>
  
  <!-- Marker 3 -->
  <circle cx="600" cy="250" r="20" fill="#FF6B6B" stroke="white" stroke-width="3"/>
  <text x="600" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="white">3</text>
  
  <!-- Compass -->
  <g transform="translate(750, 50)">
    <circle cx="0" cy="0" r="25" fill="white" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#333" stroke-width="1"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#333" stroke-width="1"/>
    <polygon points="0,-18 -3,-8 3,-8" fill="#FF6B6B"/>
    <text x="0" y="35" text-anchor="middle" font-size="12" font-weight="bold">N</text>
  </g>
  
  <!-- Scale -->
  <g transform="translate(50, 550)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#333" stroke-width="2"/>
    <line x1="50" y1="-5" x2="50" y2="5" stroke="#333" stroke-width="2"/>
    <text x="25" y="20" text-anchor="middle" font-size="11">1 km</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Recycler Locations Map</text>
</svg>
